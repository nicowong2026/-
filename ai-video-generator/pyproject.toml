[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-generator"
version = "0.1.0"
description = "AI-powered full-pipeline video generation and production toolkit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "AI Video Generator Contributors" }
]
keywords = ["ai", "video", "generation", "text-to-video", "stable-diffusion", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "openai>=1.30.0",
  "anthropic>=0.28.0",
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "httpx>=0.27.0",
  "aiofiles>=23.2.1",
  "python-multipart>=0.0.9",
  "pillow>=10.3.0",
  "ffmpeg-python>=0.2.0",
  "moviepy>=1.0.3",
  "openai-whisper>=20231117",
  "edge-tts>=6.1.10",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
  "tenacity>=8.3.0",
  "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "black>=24.4.2",
  "ruff>=0.4.5",
  "mypy>=1.10.0",
  "pre-commit>=3.7.1",
  "httpx>=0.27.0",
  "bandit[toml]>=1.7.8",
  "types-aiofiles>=23.2.0",
]
gpu = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "diffusers>=0.28.0",
  "transformers>=4.41.0",
  "accelerate>=0.30.0",
  "xformers>=0.0.26",
]

[project.scripts]
ai-video = "src.cli:app"

[project.urls]
Homepage = "https://github.com/your-username/ai-video-generator"
Documentation = "https://github.com/your-username/ai-video-generator/tree/main/docs"
Repository = "https://github.com/your-username/ai-video-generator"
Issues = "https://github.com/your-username/ai-video-generator/issues"
Changelog = "https://github.com/your-username/ai-video-generator/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["src"]
omit = ["src/cli.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert usage in tests
